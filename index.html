<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songs by Omkar Kadam 610</title>
<style>
  :root { --bg:#14171c; --panel:#1d222a; --text:#e8ecf1; --accent:#3d8bfd; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:20px; padding:24px; color:var(--text);
         background: radial-gradient(ellipse at 50% 120%, #1b2540 0%, #0d1018 55%, #07090e 100%) fixed;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Starfield sits behind everything */
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .layout, .controls { position:relative; z-index:1; }

  /* Main player (80%) + playlist (20%) side by side */
  .layout { width:min(1500px,100%); display:grid; grid-template-columns:calc(80% - 8px) calc(20% - 8px);
            gap:16px; align-items:stretch;
            grid-template-areas:"player playlist"; }
  .player { grid-area:player; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .player iframe { width:100%; height:100%; border:0; display:block; }

  /* Playlist panel matches the player's height */
  .playlist { grid-area:playlist; position:relative; min-height:0; background:rgba(255,255,255,.05); border-radius:10px; overflow:hidden;
              border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .pl-head { position:absolute; top:0; left:0; right:0; height:38px; display:flex; align-items:center; padding:0 12px;
             font-size:13px; font-weight:700; letter-spacing:.4px; background:rgba(13,16,24,.85);
             border-bottom:1px solid rgba(255,255,255,.1); }
  .pl-list { position:absolute; inset:38px 0 0 0; overflow-y:auto; margin:0; padding:6px; list-style:none; }
  .pl-list::-webkit-scrollbar { width:6px; }
  .pl-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:3px; }
  .pl-item { display:flex; gap:8px; align-items:flex-start; padding:6px; border-radius:8px; cursor:pointer;
             border:1px solid transparent; transition:background .15s ease, border-color .15s ease; }
  .pl-item:hover { background:rgba(61,139,253,.15); }
  .pl-item:focus-visible { outline:2px solid var(--accent); }
  .pl-item.active { background:rgba(122,92,255,.28); border-color:rgba(122,92,255,.7); }
  .pl-item img { width:72px; aspect-ratio:16/9; object-fit:cover; border-radius:5px; flex:none; background:#000; }
  .pl-item .t { font-size:12px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
                overflow:hidden; word-break:break-word; }
  .pl-item .n { font-size:11px; opacity:.6; display:block; margin-bottom:2px; }
  .pl-msg { padding:12px; font-size:12px; opacity:.75; }

  .controls { grid-area:player; align-self:end; justify-self:center; margin-bottom:56px; z-index:2; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:10px 14px;
              border-radius:999px; background:rgba(13,16,24,.6); border:1px solid rgba(255,255,255,.14);
              backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
              box-shadow:0 8px 30px rgba(0,0,0,.4); }
  button { display:inline-flex; align-items:center; justify-content:center; padding:12px; font-size:15px; font-weight:600;
           letter-spacing:.3px; color:var(--text); background:rgba(255,255,255,.07);
           border:1px solid rgba(255,255,255,.14); border-radius:999px; cursor:pointer;
           transition:transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
  button svg { width:20px; height:20px; fill:currentColor; flex:none; transition:transform .2s ease; }
  button:hover { transform:translateY(-2px); border-color:var(--accent); background:rgba(61,139,253,.18);
                 box-shadow:0 0 18px rgba(61,139,253,.55); }
  button:hover svg { transform:scale(1.15); }
  button:active { transform:translateY(0) scale(.96); }
  button.primary { background:linear-gradient(135deg,#3d8bfd,#7a5cff); border-color:transparent; color:#fff;
                   box-shadow:0 0 20px rgba(91,110,255,.55); }
  button.primary:hover { box-shadow:0 0 28px rgba(122,92,255,.8); background:linear-gradient(135deg,#5599ff,#8d72ff); }
  svg[hidden] { display:none; }
  .volume { display:flex; align-items:center; gap:8px; }
  input[type=range] { width:110px; accent-color:var(--accent); cursor:pointer; }
  @media (max-width:480px) {
    input[type=range] { width:60px; }
    button { padding:9px; }
    button svg { width:18px; height:18px; }
    .controls { gap:6px !important; padding:6px 8px !important; }
    .volume { gap:4px; }
  }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

  /* On narrow screens the playlist drops below the player */
  @media (max-width:1024px) {
    .layout { grid-template-columns:1fr; grid-template-areas:"player" "playlist"; }
    .controls { margin-bottom:48px; padding:6px 10px; gap:8px; }
    .playlist { min-height:320px; }
  }
</style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="layout">
    <div class="player"><div id="yt"></div></div>
    <aside class="playlist" aria-label="Playlist">
      <div class="pl-head">Playlist</div>
      <ul class="pl-list" id="plList"><li class="pl-msg">Loading playlist…</li></ul>
    </aside>

    <div class="controls">
    <button id="prev" aria-label="Previous song">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="primary" id="toggle" aria-label="Play">
      <svg id="icoPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="6" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.2"/></svg>
    </button>
    <button id="next" aria-label="Next song">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <div class="volume">
      <button id="mute" class="icon-btn" aria-label="Mute">
        <svg id="icoVol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg id="icoMuted" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <input type="range" id="vol" min="0" max="100" value="100" aria-label="Volume">
    </div>
    <button id="full" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4v2H6v3H4zm14-5h1a1 1 0 0 1 1 1v4h-2V6h-3V4h3zM4 15h2v3h3v2H5a1 1 0 0 1-1-1v-4zm14 0h2v4a1 1 0 0 1-1 1h-4v-2h3v-3z"/></svg>
    </button>
    </div>
  </div>

  <script>
    // Slow-moving starfield
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, dpr, stars = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.round((w * h) / 4500); // density scales with screen size
        stars = Array.from({ length: count }, () => {
          const depth = Math.random();              // 0 = far, 1 = near
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.4 + depth * 1.3,                   // nearer stars are bigger
            speed: 2 + depth * 8,                   // px per second, nearer move faster
            tw: Math.random() * Math.PI * 2,        // twinkle phase
            tws: 0.4 + Math.random() * 0.9          // twinkle speed
          };
        });
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        ctx.clearRect(0, 0, w, h);

        for (const s of stars) {
          if (!reduceMotion) {
            s.x += s.speed * dt;                    // drift slowly to the right
            s.y += s.speed * 0.25 * dt;             // and a touch downward
            s.tw += s.tws * dt;
            if (s.x > w + 2) { s.x = -2; s.y = Math.random() * h; }
            if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }
          }
          const alpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(s.tw));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // If the list doesn't load, replace this with the full playlist ID from the playlist's URL (list=...)
    // Previous playlist (Meditate): PLVNdeZSBrci4
    const PLAYLIST_ID = 'PLWW0p45eLuto';

    let player, listBuilt = false;
    const listEl = document.getElementById('plList');

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt', {
        width: '100%', height: '100%',
        playerVars: { listType: 'playlist', list: PLAYLIST_ID, rel: 0, playsinline: 1 },
        events: {
          onReady: () => { waitForPlaylist(); syncVolume(); updateToggle(); },
          onStateChange: () => { if (!listBuilt) tryBuild(); highlight(); updateToggle(); },
          onError: () => { if (!listBuilt) showMsg('Could not load this playlist. Please check the playlist ID.'); }
        }
      });
    }

    function showMsg(text) {
      listEl.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'pl-msg';
      li.textContent = text;
      listEl.appendChild(li);
    }

    function waitForPlaylist() {
      let tries = 0;
      const timer = setInterval(() => {
        if (listBuilt) return clearInterval(timer);
        tryBuild();
        if (listBuilt) return clearInterval(timer);
        if (++tries > 30) { clearInterval(timer); showMsg('Could not load this playlist. Please check the playlist ID.'); }
      }, 500);
    }

    function tryBuild() {
      const ids = player && player.getPlaylist && player.getPlaylist();
      if (!ids || !ids.length) return;
      listBuilt = true;
      listEl.innerHTML = '';
      ids.forEach((id, i) => {
        const li = document.createElement('li');
        li.className = 'pl-item';
        li.tabIndex = 0;
        li.setAttribute('role', 'button');
        li.dataset.index = i;

        const img = document.createElement('img');
        img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
        img.alt = '';
        img.loading = 'lazy';

        const box = document.createElement('div');
        const num = document.createElement('span');
        num.className = 'n';
        num.textContent = i + 1;
        const title = document.createElement('span');
        title.className = 't';
        title.textContent = 'Video ' + (i + 1);
        box.append(num, title);
        li.append(img, box);

        const play = () => player.playVideoAt(i);
        li.addEventListener('click', play);
        li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
        listEl.appendChild(li);

        // Fetch the real title (no API key needed)
        fetch('https://www.youtube.com/oembed?format=json&url=' +
              encodeURIComponent('https://www.youtube.com/watch?v=' + id))
          .then(r => r.ok ? r.json() : null)
          .then(d => { if (d && d.title) title.textContent = d.title; })
          .catch(() => {});
      });
      highlight();
    }

    function highlight() {
      if (!listBuilt || !player.getPlaylistIndex) return;
      const idx = player.getPlaylistIndex();
      listEl.querySelectorAll('.pl-item').forEach(el => {
        const on = Number(el.dataset.index) === idx;
        el.classList.toggle('active', on);
        if (on) el.scrollIntoView({ block: 'nearest' });
      });
    }

    // SVG elements have no .hidden property, so toggle the attribute directly
    function setHidden(id, hide) { document.getElementById(id).toggleAttribute('hidden', hide); }

    // Single play / pause button
    const toggleBtn = document.getElementById('toggle');
    function isPlaying() {
      const st = player && player.getPlayerState && player.getPlayerState();
      return st === 1 || st === 3; // playing or buffering
    }
    function updateToggle() {
      const playing = isPlaying();
      setHidden('icoPlay', playing);
      setHidden('icoPause', !playing);
      toggleBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }
    toggleBtn.onclick = () => {
      if (!player || !player.getPlayerState) return;
      isPlaying() ? player.pauseVideo() : player.playVideo();
    };

    // Previous / next song in the playlist
    document.getElementById('prev').onclick = () => player && player.previousVideo && player.previousVideo();
    document.getElementById('next').onclick = () => player && player.nextVideo && player.nextVideo();

    // Volume control (mute button + slider)
    const volEl = document.getElementById('vol');
    const muteBtn = document.getElementById('mute');
    function updateVolumeUI() {
      const muted = player.isMuted() || Number(volEl.value) === 0;
      setHidden('icoVol', muted);
      setHidden('icoMuted', !muted);
      muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
    }
    function syncVolume() {
      volEl.value = player.getVolume();
      updateVolumeUI();
    }
    volEl.addEventListener('input', () => {
      if (!player || !player.setVolume) return;
      const v = Number(volEl.value);
      player.setVolume(v);
      if (v > 0 && player.isMuted()) player.unMute();
      updateVolumeUI();
    });
    muteBtn.onclick = () => {
      if (!player || !player.isMuted) return;
      if (player.isMuted() || Number(volEl.value) === 0) {
        if (Number(volEl.value) === 0) { volEl.value = 50; player.setVolume(50); }
        player.unMute();
      } else {
        player.mute();
      }
      updateVolumeUI();
    };

    document.getElementById('full').onclick  = () => {
      const f = player && player.getIframe();
      if (!f) return;
      (f.requestFullscreen || f.webkitRequestFullscreen || f.msRequestFullscreen).call(f);
    };
  </script>
</body>
